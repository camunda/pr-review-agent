name: pr-review-agent

# Reusable AI pull-request review. Call it from a `pull_request` workflow in
# your repository — see examples/caller-workflow.yml and docs/configuration.md.
#
# Security model (docs/security-model.md):
#   - Everything that decides HOW a PR is judged — this workflow, the scripts,
#     the prompt, the team config and (by default) the rubric — lives in
#     pr-review-agent and is checked out (once, in the `config` job) at the
#     exact commit of this workflow
#     (`job.workflow_sha`). A PR in the reviewed repo cannot modify any of it.
#   - Review skills / a rubric that live in the reviewed repo are read from the
#     PR's BASE commit, never its head.
#   - The agent runs in a READ-ONLY job. All write privileges live in `decide`,
#     which runs no AI and re-derives the hard escalation rules deterministically.

on:
  workflow_call:
    inputs:
      config:
        description: >-
          Name of the team config in the calling repository, i.e.
          .github/pr-review-agent/<config>.yml, read from its default branch.
        required: true
        type: string
      force_shadow_mode:
        description: >-
          Force shadow mode (comment only, never approve) regardless of the
          config. Can only make the review safer, never less safe.
        required: false
        type: boolean
        default: false
      runs_on:
        description: >-
          Runner label for all jobs. On a public repository the review job
          always runs on `ubuntu-latest`, because the egress firewall
          (harden-runner) does not work on `ubuntu-slim` or self-hosted runners.
        required: false
        type: string
        default: ubuntu-slim
      egress_policy:
        description: >-
          Network egress policy of the review job on a public repository:
          `block` (only the allowlisted hosts) or `audit` (log only, to find
          missing hosts). Private repositories are not filtered.
        required: false
        type: string
        default: block
      agent_repo_token_vault_secret:
        description: >-
          Optional Vault secret "<path> <field>" holding a token with
          contents:read on pr-review-agent, used to check out this repository
          when the caller's GITHUB_TOKEN cannot read it. Leave empty to use
          GITHUB_TOKEN. Only the `config` job (no AI, no PR code) imports it;
          the agent and decide jobs receive pr-review-agent as an artifact.
        required: false
        type: string
        default: ""
      vault_auth_method:
        description: >-
          How the `config` job logs in to Vault: "approle" (VAULT_ROLE_ID,
          VAULT_SECRET_ID) or "jwt" (GitHub OIDC: VAULT_JWT_PATH,
          VAULT_JWT_ROLE, VAULT_JWT_AUDIENCE). Either way the calling job must
          grant `id-token: write`. The agent's job never logs in to Vault.
        required: false
        type: string
        default: approle
    secrets:
      VAULT_ADDR:
        required: true
      VAULT_ROLE_ID:
        required: false
      VAULT_SECRET_ID:
        required: false
      VAULT_JWT_PATH:
        required: false
      VAULT_JWT_ROLE:
        required: false
      VAULT_JWT_AUDIENCE:
        required: false
    outputs:
      verdict:
        description: AUTO_APPROVE or NEEDS_HUMAN (empty when the PR was not reviewed).
        value: ${{ jobs.decide.outputs.verdict }}
      escalation_type:
        description: NONE, POLICY, FINDINGS or BOTH (empty when the PR was not reviewed).
        value: ${{ jobs.decide.outputs.escalation_type }}
      selected:
        description: '"true" when the event passed the trigger filter (see `reviewed`).'
        value: ${{ jobs.config.outputs.run }}
      reviewed:
        description: '"true" only when the agent produced and uploaded a verdict.'
        value: ${{ jobs.review.outputs.reviewed }}

# Enforced here too (not only in the caller): a superseded run must not go on to
# post or approve. The approve step additionally refuses to approve any commit
# other than the one reviewed.
concurrency:
  group: pr-review-agent-${{ github.repository }}-${{ inputs.config }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions: {}

jobs:
  # ---------------------------------------------------------------------------
  # Job 0 — resolve the team config and decide whether to review at all. Never
  # touches PR code. The only job that logs in to Vault (and the only one with
  # `id-token: write`): it hands the Anthropic key to `review` as a single-use
  # Vault wrapping token, so the agent's job holds no Vault credentials and
  # cannot mint OIDC tokens.
  # ---------------------------------------------------------------------------
  config:
    name: Resolve config
    runs-on: ${{ inputs.runs_on }}
    timeout-minutes: 5
    permissions:
      contents: read
      # Counts earlier agent reviews for triggers.max_auto_reviews.
      pull-requests: read
      id-token: write
    outputs:
      run: ${{ steps.should.outputs.run }}
      cap_reached: ${{ steps.should.outputs.cap_reached }}
      review_count: ${{ steps.should.outputs.review_count }}
      max_auto_reviews: ${{ steps.cfg.outputs.max_auto_reviews }}
      shadow_mode: ${{ (inputs.force_shadow_mode || steps.cfg.outputs.shadow_mode == 'true') && 'true' || 'false' }}
      timeout_minutes: ${{ steps.cfg.outputs.timeout_minutes }}
      # A single-use wrapping token, not the key. Deliberately not masked:
      # GitHub drops job outputs that contain masked values.
      anthropic_wrap_token: ${{ steps.wrap_jwt.outputs.wrap-token || steps.wrap.outputs.wrap_token }}
      model: ${{ steps.cfg.outputs.model }}
      dedup_model: ${{ steps.cfg.outputs.dedup_model }}
      allowed_bots: ${{ steps.cfg.outputs.allowed_bots }}
      opt_in_label: ${{ steps.cfg.outputs.opt_in_label }}
      needs_human_label: ${{ steps.cfg.outputs.needs_human_label }}
      capture_alert_mentions: ${{ steps.cfg.outputs.capture_alert_mentions }}
      rubric_ref: ${{ steps.cfg.outputs.rubric_ref }}
    steps:
      - name: Check Vault auth method
        env:
          METHOD: ${{ inputs.vault_auth_method }}
        run: |
          case "$METHOD" in
            approle | jwt) ;;
            *) echo "::error::vault_auth_method must be approle or jwt, got '$METHOD'"; exit 1 ;;
          esac

      # Secrets are checked only right before a Vault step runs: fork and
      # Dependabot PRs get no Actions secrets and must still reach the skip in
      # should-review.sh. Only booleans reach the shell, never the values.
      - name: Check Vault secrets (checkout token)
        if: inputs.agent_repo_token_vault_secret != ''
        env:
          METHOD: ${{ inputs.vault_auth_method }}
          HAS_APPROLE: ${{ secrets.VAULT_ROLE_ID != '' && secrets.VAULT_SECRET_ID != '' }}
          HAS_JWT: ${{ secrets.VAULT_JWT_PATH != '' && secrets.VAULT_JWT_ROLE != '' }}
        run: |
          case "$METHOD" in
            approle) [ "$HAS_APPROLE" = true ] || { echo "::error::vault_auth_method=approle needs the VAULT_ROLE_ID and VAULT_SECRET_ID secrets"; exit 1; } ;;
            jwt) [ "$HAS_JWT" = true ] || { echo "::error::vault_auth_method=jwt needs the VAULT_JWT_PATH and VAULT_JWT_ROLE secrets"; exit 1; } ;;
          esac

      # vault-action ignores the role and credential inputs of the other method,
      # but builds the login URL from `path` for every method. So `path` is set
      # only for JWT; an empty `path` falls back to the method name (approle).
      - name: Import agent checkout token
        id: token
        if: inputs.agent_repo_token_vault_secret != ''
        uses: hashicorp/vault-action@892a26828f195e65540a40b4768ae4571f51ebfc # v4.0.0
        with:
          url: ${{ secrets.VAULT_ADDR }}
          method: ${{ inputs.vault_auth_method }}
          roleId: ${{ secrets.VAULT_ROLE_ID }}
          secretId: ${{ secrets.VAULT_SECRET_ID }}
          path: ${{ inputs.vault_auth_method == 'jwt' && secrets.VAULT_JWT_PATH || '' }}
          role: ${{ secrets.VAULT_JWT_ROLE }}
          jwtGithubAudience: ${{ secrets.VAULT_JWT_AUDIENCE }}
          exportEnv: false
          secrets: ${{ inputs.agent_repo_token_vault_secret }} | AGENT_REPO_TOKEN ;

      - name: Check out pr-review-agent (this workflow's own commit)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .pr-review-agent
          token: ${{ steps.token.outputs.AGENT_REPO_TOKEN || github.token }}
          persist-credentials: false

      - name: Load and validate team config
        id: cfg
        env:
          CONFIG_NAME: ${{ inputs.config }}
          AGENT_DIR: .pr-review-agent
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          GH_TOKEN: ${{ github.token }}
        run: bash .pr-review-agent/scripts/load-config.sh

      - name: Decide whether to review this event
        id: should
        if: steps.cfg.outputs.found == 'true'
        env:
          CONFIG_FILE: ${{ steps.cfg.outputs.config_file }}
          GH_TOKEN: ${{ github.token }}
        run: bash .pr-review-agent/scripts/should-review.sh

      - name: Check Vault secrets (Anthropic key)
        if: steps.should.outputs.run == 'true'
        env:
          METHOD: ${{ inputs.vault_auth_method }}
          HAS_APPROLE: ${{ secrets.VAULT_ROLE_ID != '' && secrets.VAULT_SECRET_ID != '' }}
          HAS_JWT: ${{ secrets.VAULT_JWT_PATH != '' && secrets.VAULT_JWT_ROLE != '' }}
        # Same check as "Check Vault secrets (checkout token)".
        run: |
          case "$METHOD" in
            approle) [ "$HAS_APPROLE" = true ] || { echo "::error::vault_auth_method=approle needs the VAULT_ROLE_ID and VAULT_SECRET_ID secrets"; exit 1; } ;;
            jwt) [ "$HAS_JWT" = true ] || { echo "::error::vault_auth_method=jwt needs the VAULT_JWT_PATH and VAULT_JWT_ROLE secrets"; exit 1; } ;;
          esac

      # Only the key is wrapped, not the rest of what the Vault role can read.
      # JWT: Infrastructure's shared action (the Camunda policy for agentic
      # workflows). It logs in, reads the key and wraps it in one step.
      - name: Wrap the Anthropic key for the review job (JWT)
        id: wrap_jwt
        if: steps.should.outputs.run == 'true' && inputs.vault_auth_method == 'jwt'
        uses: camunda/infra-global-github-actions/vault-wrapped-secrets/wrap@6644ac7ceab8e1b32359cc25a5161c46156fc319 # vault-wrapped-secrets-1.0.1
        with:
          vault-url: ${{ secrets.VAULT_ADDR }}
          vault-auth-jwt-path: ${{ secrets.VAULT_JWT_PATH }}
          vault-auth-jwt-role: ${{ secrets.VAULT_JWT_ROLE }}
          vault-auth-jwt-audience: ${{ secrets.VAULT_JWT_AUDIENCE }}
          secrets: ${{ steps.cfg.outputs.vault_anthropic_secret }}
          wrap-ttl: 5m

      # AppRole: the shared action supports JWT only, so read the key with
      # vault-action and wrap it with our script. Remove both steps once
      # Infrastructure turns off AppRole (camunda/team-infrastructure#1076).
      - name: Read the Anthropic key (AppRole)
        id: anthropic
        if: steps.should.outputs.run == 'true' && inputs.vault_auth_method == 'approle'
        uses: hashicorp/vault-action@892a26828f195e65540a40b4768ae4571f51ebfc # v4.0.0
        with:
          url: ${{ secrets.VAULT_ADDR }}
          method: approle
          roleId: ${{ secrets.VAULT_ROLE_ID }}
          secretId: ${{ secrets.VAULT_SECRET_ID }}
          outputToken: true
          exportEnv: false
          secrets: ${{ steps.cfg.outputs.vault_anthropic_secret }}

      - name: Wrap the Anthropic key for the review job (AppRole)
        id: wrap
        if: steps.should.outputs.run == 'true' && inputs.vault_auth_method == 'approle'
        env:
          VAULT_ADDR: ${{ secrets.VAULT_ADDR }}
          VAULT_TOKEN: ${{ steps.anthropic.outputs.vault_token }}
          ANTHROPIC_API_KEY: ${{ steps.anthropic.outputs.ANTHROPIC_API_KEY }}
        run: bash .pr-review-agent/scripts/vault-wrap-key.sh

      # The only place pr-review-agent is checked out (and the only job that may
      # hold the checkout token). Later jobs download this bundle: artifacts
      # are immutable once uploaded, so nothing in the agent job can replace it,
      # and the agent job never holds a GitHub token beyond its read-only one.
      - name: Bundle pr-review-agent for later jobs
        if: steps.should.outputs.run == 'true' || steps.should.outputs.cap_reached == 'true'
        env:
          CONFIG_FILE: ${{ steps.cfg.outputs.config_file }}
        run: |
          mkdir -p "${RUNNER_TEMP}/pr-review-agent-bundle"
          cp -R .pr-review-agent/scripts .pr-review-agent/prompts "${RUNNER_TEMP}/pr-review-agent-bundle/"
          cp "$CONFIG_FILE" "${RUNNER_TEMP}/pr-review-agent-bundle/config.json"

      - name: Upload pr-review-agent bundle
        if: steps.should.outputs.run == 'true' || steps.should.outputs.cap_reached == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pr-review-agent-bundle
          path: ${{ runner.temp }}/pr-review-agent-bundle
          if-no-files-found: error
          retention-days: 1

  # ---------------------------------------------------------------------------
  # Job 0b — tells the PR why an automatic review did not run when it reached
  # triggers.max_auto_reviews. Runs no AI and no PR code; its scripts come from
  # the bundle. Best effort: continue-on-error on the whole job means a failure
  # anywhere in it (bundle download included) never fails the calling workflow.
  # The concurrency group is shared by every config of the repository (the
  # workflow-level group is per config), so two configs cannot both post a
  # notice for the same PR; queued runs wait instead of being cancelled.
  # ---------------------------------------------------------------------------
  cap-notice:
    name: Review cap notice
    needs: config
    if: needs.config.outputs.cap_reached == 'true'
    runs-on: ${{ inputs.runs_on }}
    timeout-minutes: 5
    continue-on-error: true
    concurrency:
      group: pr-review-agent-cap-notice-${{ github.repository }}-${{ github.event.pull_request.number }}
      cancel-in-progress: false
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Download pr-review-agent bundle
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: pr-review-agent-bundle
          path: .pr-review-agent

      - name: Post the review-cap notice (once per PR)
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          OPT_IN_LABEL: ${{ needs.config.outputs.opt_in_label }}
          REVIEW_COUNT: ${{ needs.config.outputs.review_count }}
          MAX_AUTO_REVIEWS: ${{ needs.config.outputs.max_auto_reviews }}
        run: bash .pr-review-agent/scripts/post-cap-notice.sh

  # ---------------------------------------------------------------------------
  # Job 1 — the agent. RUNS READ-ONLY. It can read the PR and write a verdict
  # file, but holds no write-capable token and cannot approve, comment, or push.
  # ---------------------------------------------------------------------------
  review:
    name: AI review (read-only)
    needs: config
    if: needs.config.outputs.run == 'true'
    # harden-runner needs a GitHub-hosted VM (not ubuntu-slim, not self-hosted).
    runs-on: ${{ github.event.repository.private && inputs.runs_on || 'ubuntu-latest' }}
    timeout-minutes: ${{ fromJSON(needs.config.outputs.timeout_minutes) }}
    permissions:
      contents: read
      pull-requests: read
    outputs:
      session_captured: ${{ steps.session_check.outputs.captured }}
      reviewed: ${{ steps.reviewed.outputs.reviewed }}
    env:
      SHADOW_MODE: ${{ needs.config.outputs.shadow_mode }}
    steps:
      # First, so the always() transcript steps get a path even when a later
      # step (the OIDC check, the unwrap) fails the job early.
      - name: Resolve session transcript path
        run: echo "SESSION_MASKED_FILE=${RUNNER_TEMP}/ai-review-session-masked.json" >> "$GITHUB_ENV"

      # Guarantee 8 at runtime: GitHub sets ACTIONS_ID_TOKEN_REQUEST_URL only
      # when the job has `id-token: write`. Fails a future edit that grants it
      # here, before the key is unwrapped and before the agent runs.
      - name: Check that this job has no OIDC access
        run: |
          if [ -n "${ACTIONS_ID_TOKEN_REQUEST_URL:-}" ]; then
            echo "::error::The review job has id-token access. It must never have it (docs/security-model.md, guarantee 8)."
            exit 1
          fi
          echo "OK: no OIDC token access in this job."

      # Runs right away, so the 5-minute wrap TTL only has to cover the queue wait.
      # Only the Anthropic key. The agent deliberately gets NO GitHub PAT — it
      # uses the job's read-only GITHUB_TOKEN to read the PR — and this job has
      # no Vault login and no `id-token`: after this step the wrapping token is
      # used up, so nothing here can reach Vault again. Fails if the token
      # expired or something else unwrapped it first.
      - name: Unwrap the Anthropic key
        id: unwrap
        uses: camunda/infra-global-github-actions/vault-wrapped-secrets/unwrap@6644ac7ceab8e1b32359cc25a5161c46156fc319 # vault-wrapped-secrets-1.0.1
        with:
          vault-url: ${{ secrets.VAULT_ADDR }}
          wrap-token: ${{ needs.config.outputs.anthropic_wrap_token }}

      # "Re-run failed jobs" does not re-run `config`, so this job gets the old
      # token again. A fresh token per attempt would let this job request new
      # ones, which is what wrapping prevents, so point to "Re-run all jobs".
      - name: Explain a failed unwrap
        if: failure() && steps.unwrap.outcome == 'failure'
        env:
          ATTEMPT: ${{ github.run_attempt }}
        run: |
          echo "::error::Could not unwrap the Anthropic key. The wrapping token works once and for 5 minutes."
          if [ "$ATTEMPT" -gt 1 ]; then
            echo "::error::This is attempt $ATTEMPT: 'Re-run failed jobs' reuses the token of the first attempt. Use 'Re-run all jobs' instead."
          else
            echo "::error::The token expired before this job started (runner queue), or something else unwrapped it first. Treat the second case as tampering. Use 'Re-run all jobs' to retry."
          fi

      # Reviewed repo first: its checkout cleans the workspace root.
      - name: Check out the reviewed repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Download pr-review-agent bundle
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: pr-review-agent-bundle
          path: .pr-review-agent

      # Rubric + skills into .policy/, from pr-review-agent or the PR BASE
      # commit — never the PR head.
      - name: Load review policy (immune to PR edits)
        env:
          CONFIG_FILE: .pr-review-agent/config.json
          AGENT_DIR: .pr-review-agent
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: bash .pr-review-agent/scripts/load-policy.sh

      - name: Prepare verdict output directory
        run: mkdir -p ai-review

      - name: Render review prompt
        id: prompt
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          CONFIG_FILE: .pr-review-agent/config.json
          AGENT_DIR: .pr-review-agent
        run: bash .pr-review-agent/scripts/render-prompt.sh

      # Public repositories: anyone can comment, so prompt injection is
      # realistic. From here on the job can only reach the hosts below, so an
      # injected agent cannot send the key elsewhere. It starts after the
      # unwrap and the checkouts, so Vault and those hosts need no entry. sudo
      # is disabled so the firewall cannot be removed. Private repos:
      # harden-runner needs a paid plan there, and the risk is lower (only org
      # members comment).
      - name: Restrict network egress (public repositories)
        if: ${{ !github.event.repository.private }}
        uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: ${{ inputs.egress_policy }}
          disable-sudo-and-containers: true
          # Claude API; GitHub API (gh, dedup); Bun download (github.com and its
          # release redirects); Bun dependencies of claude-code-action; Claude
          # Code installer; artifact upload/download.
          allowed-endpoints: >-
            api.anthropic.com:443
            api.github.com:443
            github.com:443
            objects.githubusercontent.com:443
            release-assets.githubusercontent.com:443
            registry.npmjs.org:443
            claude.ai:443
            downloads.claude.ai:443
            results-receiver.actions.githubusercontent.com:443
            *.blob.core.windows.net:443

      # anthropics/claude-code-action is a third-party action — the official
      # action for running Claude Code agents in CI. Pinned to a commit SHA.
      - name: Run Claude review agent (read-only, produces a verdict file)
        id: claude
        uses: anthropics/claude-code-action@1d6de8cb0c237e7c15e9e1bdf973826ebae490cc # v1.0.248
        env:
          # Keep git away from system/user config (aliases, external diff and
          # textconv drivers). claude-code-action only writes the repo config.
          GIT_CONFIG_NOSYSTEM: "1"
          GIT_CONFIG_GLOBAL: /dev/null
          # No telemetry or auto-update traffic, so the egress allowlist stays short.
          CLAUDE_CODE_DISABLE_NONESSENTIAL_TRAFFIC: "1"
        with:
          anthropic_api_key: ${{ fromJSON(steps.unwrap.outputs.secrets || '{}').ANTHROPIC_API_KEY }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          prompt: ${{ steps.prompt.outputs.text }}
          # Named bots only (never `*`): lets e.g. a PR opened by Claude itself
          # be reviewed on its `opened` event.
          allowed_bots: ${{ needs.config.outputs.allowed_bots }}
          # Only the commands the prompt needs. No `git -c`/`gh alias` (run
          # arbitrary commands), no `gh api` (can target another host), and file
          # writes only below ai-review/ (Edit rules cover the Write tool; a
          # `Write(path)` rule is ignored). Prefix rules are not a sandbox, so
          # git flags that write files, read files outside the repo or run
          # commands are denied explicitly, and Read cannot reach /proc (the
          # key is in /proc/self/environ). The design still treats everything
          # produced on this runner as untrusted (docs/security-model.md).
          claude_args: >-
            --allowedTools "Bash(gh pr view:*),Bash(gh pr diff:*),Bash(git diff:*),Bash(git log:*),Bash(git show:*),Read,Grep,Glob,Edit(ai-review/**)"
            --disallowedTools "Read(//proc/**),Bash(git * --output*),Bash(git * --no-index*),Bash(git * --ext-diff*),Bash(git * --textconv*)"${{ needs.config.outputs.model != '' && format(' --model {0}', needs.config.outputs.model) || '' }}

      # The agent could write files (only below ai-review/, unless it escaped
      # its tool rules), so files it could reach are not trusted after this
      # point. Later steps that hold the Anthropic key run
      # scripts from a FRESH download of the immutable bundle, never from
      # .pr-review-agent or the PR checkout. This stops file
      # tampering via Write; it does not undo a full runner compromise (see
      # docs/security-model.md), which is why their outputs stay untrusted.
      - name: Clear the trusted tooling path
        if: always()
        run: rm -rf .trusted-agent

      - name: Download pr-review-agent bundle (trusted, post-agent)
        if: always()
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: pr-review-agent-bundle
          path: .trusted-agent

      # LLM dedup pass. Runs here, in the read-only job that holds the key, so
      # the AI stays out of the privileged job. Fail-open and continue-on-error:
      # a dedup problem never drops a finding and never fails the review.
      - name: Deduplicate findings against prior review rounds (LLM filter pass)
        if: success() && hashFiles('ai-review/verdict.json') != ''
        continue-on-error: true
        env:
          ANTHROPIC_API_KEY: ${{ fromJSON(steps.unwrap.outputs.secrets || '{}').ANTHROPIC_API_KEY }}
          ANTHROPIC_DEDUP_MODEL: ${{ needs.config.outputs.dedup_model }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          set -uo pipefail
          # Drop any dedup.json the Write-capable agent may have planted, so a
          # failure before the trusted script writes its own result fails open.
          rm -f ai-review/dedup.json
          bash .trusted-agent/scripts/ai-review-dedup-findings.sh

      - name: Verify the agent produced a verdict
        run: test -f ai-review/verdict.json

      # `decide` posts this text on the PR (publicly, on a public repo). Fail
      # closed: if masking fails, nothing is uploaded and nothing is posted.
      - name: Mask secrets from verdict and dedup files
        env:
          # Passed via env (read from %ENV), never on argv.
          ANTHROPIC_API_KEY: ${{ fromJSON(steps.unwrap.outputs.secrets || '{}').ANTHROPIC_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash .trusted-agent/scripts/ai-review-mask-session.sh ai-review/verdict.json ai-review/dedup.json

      - name: Upload verdict artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ai-review-verdict
          path: |
            ai-review/verdict.json
            ai-review/dedup.json
          if-no-files-found: error
          retention-days: 30

      - name: Mark reviewed
        id: reviewed
        run: echo "reviewed=true" >> "$GITHUB_OUTPUT"

      - name: Mask secrets from session transcript
        if: always()
        env:
          EXECUTION_FILE: ${{ steps.claude.outputs.execution_file }}
          MASKED_FILE: ${{ env.SESSION_MASKED_FILE }}
          # Passed via env (read from %ENV), never on argv.
          ANTHROPIC_API_KEY: ${{ fromJSON(steps.unwrap.outputs.secrets || '{}').ANTHROPIC_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash .trusted-agent/scripts/ai-review-mask-session.sh

      - name: Upload review session transcript (masked)
        id: session_upload
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ai-review-session
          path: ${{ env.SESSION_MASKED_FILE }}
          if-no-files-found: warn
          retention-days: 30

      - name: Record whether the session transcript was captured
        id: session_check
        if: always()
        env:
          ARTIFACT_ID: ${{ steps.session_upload.outputs.artifact-id }}
        run: |
          out="${SESSION_MASKED_FILE}"
          if [ -n "${ARTIFACT_ID:-}" ] && [ -f "$out" ] && [ -s "$out" ]; then
            echo "captured=true" >> "$GITHUB_OUTPUT"
          else
            echo "captured=false" >> "$GITHUB_OUTPUT"
            echo "::warning::AI review session transcript not captured (artifact-id='${ARTIFACT_ID:-}')"
          fi

  # ---------------------------------------------------------------------------
  # Job 2 — the gate + action. Holds the ONLY write token. Runs NO AI and has no
  # Anthropic key. Never checks out the reviewed repository: every script comes
  # from the pr-review-agent bundle (this workflow's commit), and `gh` targets the PR via
  # GH_REPO.
  # ---------------------------------------------------------------------------
  decide:
    name: Apply verdict (deterministic gate)
    needs: [config, review]
    if: always() && needs.review.result == 'success'
    runs-on: ${{ inputs.runs_on }}
    timeout-minutes: 45
    permissions:
      contents: read
      pull-requests: write
      # `gh pr checks --required` in the live-mode approval gate.
      checks: read
      statuses: read
    outputs:
      verdict: ${{ steps.final.outputs.verdict }}
      escalation_type: ${{ steps.final.outputs.escalation_type }}
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      PR: ${{ github.event.pull_request.number }}
      SHADOW_MODE: ${{ needs.config.outputs.shadow_mode }}
    steps:
      - name: Download pr-review-agent bundle
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: pr-review-agent-bundle
          path: .pr-review-agent

      - name: Download verdict artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ai-review-verdict
          path: ai-review

      # The agent's verdict can only ever be DOWNGRADED to NEEDS_HUMAN here.
      - name: Deterministic escalation gate
        id: gate
        env:
          CONFIG_FILE: .pr-review-agent/config.json
        run: bash .pr-review-agent/scripts/gate.sh

      - name: Compute final verdict and body
        id: final
        env:
          GATE_ESCALATE: ${{ steps.gate.outputs.escalate }}
          GATE_REASON: ${{ steps.gate.outputs.reason }}
          GATE_MATCH: ${{ steps.gate.outputs.match }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          RUBRIC_REF: ${{ needs.config.outputs.rubric_ref }}
        run: bash .pr-review-agent/scripts/ai-review-compute-verdict.sh

      - name: Post review (shadow mode, or any NEEDS_HUMAN)
        if: env.SHADOW_MODE == 'true' || steps.final.outputs.verdict == 'NEEDS_HUMAN'
        env:
          VERDICT: ${{ steps.final.outputs.verdict }}
          OPT_IN_LABEL: ${{ needs.config.outputs.opt_in_label }}
          NEEDS_HUMAN_LABEL: ${{ needs.config.outputs.needs_human_label }}
          AI_REVIEW_LABEL_PRESENT: ${{ contains(github.event.pull_request.labels.*.name, needs.config.outputs.opt_in_label) }}
        run: bash .pr-review-agent/scripts/ai-review-post-summary.sh

      # Live mode only, explicit AUTO_APPROVE only, never on drafts (the script
      # re-reads the current draft state too).
      - name: Approve (live mode only, AUTO_APPROVE only, never on drafts)
        if: env.SHADOW_MODE == 'false' && steps.final.outputs.verdict == 'AUTO_APPROVE' && github.event.pull_request.draft == false
        env:
          # Approval is anchored to this commit and skipped if the PR moved on.
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: bash .pr-review-agent/scripts/ai-review-approve.sh

      # Only job with pull-requests: write, so the transcript-capture alert lives
      # here. Fail closed: anything but a confirmed capture posts an alert;
      # a confirmed capture deletes stale alerts.
      - name: Notify on session transcript capture status
        if: always()
        continue-on-error: true
        env:
          CAPTURED: ${{ needs.review.outputs.session_captured }}
          MENTIONS: ${{ needs.config.outputs.capture_alert_mentions }}
        run: |
          set -uo pipefail
          marker='<!-- ai-review-session-capture -->'
          existing="$(gh api --paginate "repos/${GITHUB_REPOSITORY}/issues/${PR}/comments" \
            --jq ".[] | select(.user.login == \"github-actions[bot]\") | select(.body | contains(\"${marker}\")) | .id")"
          keep=""
          if [ "${CAPTURED:-}" != "true" ]; then
            cc=""
            [ -n "${MENTIONS:-}" ] && cc=" cc ${MENTIONS}"
            body="⚠️ The AI review **session transcript was not captured** for the latest run — the \`ai-review-session\` artifact is missing or empty. This is most likely a \`claude-code-action\` output change (or a failed mask/upload); the review itself was unaffected.${cc}

          ${marker}"
            keep="$(gh api -X POST "repos/${GITHUB_REPOSITORY}/issues/${PR}/comments" -f body="$body" --jq '.id' || true)"
            if [ -z "$keep" ]; then
              echo "::warning::Failed to post capture-break alert; leaving existing alerts intact"
              exit 0
            fi
          fi
          for id in $existing; do
            [ "$id" = "$keep" ] && continue
            gh api -X DELETE "repos/${GITHUB_REPOSITORY}/issues/comments/${id}" || true
          done
