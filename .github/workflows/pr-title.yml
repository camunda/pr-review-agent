name: pr-title

# The squash commit takes the PR title, and release-please reads that commit to
# pick the next version. These checks keep the title in Conventional Commits form
# and make sure a breaking change has both the "!" and the BREAKING CHANGE footer.
# Both jobs are required checks on main (see README.md). See AGENTS.md for the
# conventions.

on:
  pull_request:
    types: [opened, edited, reopened, synchronize]

permissions: {}

jobs:
  conventional-title:
    name: Conventional PR title
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pull-requests: read
    steps:
      - uses: amannn/action-semantic-pull-request@66e72920af32222769c386d81f89656ebcb6d6d5 # v6.1.4
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            fix
            deps
            refactor
            docs
            test
            ci
            chore

  breaking-change:
    name: Breaking change marked consistently
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Check title "!" and BREAKING CHANGE footer
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: bash scripts/check-breaking-change.sh
      # Runs even when the title check fails, so that one run reports both.
      - name: Check the caller contract against the PR base
        if: ${{ !cancelled() }}
        env:
          EVENT_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_TITLE: ${{ github.event.pull_request.title }}
        # The checkout is the merge commit refs/pull/N/merge, built on the
        # current tip of the base branch. Its first parent is that tip. The
        # event's base.sha can be stale on `edited` and `reopened` events.
        run: |
          if [ "$(git rev-list --parents -n 1 HEAD | wc -w)" -eq 3 ]; then
            BASE_SHA=$(git rev-parse HEAD^1)
          else
            BASE_SHA=$EVENT_BASE_SHA
          fi
          echo "Contract baseline: $BASE_SHA"
          BASE_SHA=$BASE_SHA bash scripts/check-contract.sh
