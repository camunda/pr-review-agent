name: pr-title

# The squash commit takes the PR title, and release-please reads that commit to
# pick the next version. These checks keep the title in Conventional Commits form
# and make sure a breaking change has both the "!" and the BREAKING CHANGE footer.
# They are not required checks. See AGENTS.md for the conventions.

on:
  pull_request:
    types: [opened, edited, reopened, synchronize]

permissions: {}

jobs:
  conventional-title:
    name: Conventional PR title
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pull-requests: read
    steps:
      - uses: amannn/action-semantic-pull-request@2252a14e810aa9b85c2d560bd7070c802206ecf6 # v6.1.2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            fix
            deps
            refactor
            docs
            test
            ci
            chore

  breaking-change:
    name: Breaking change marked consistently
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Check title "!" and BREAKING CHANGE footer
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: bash scripts/check-breaking-change.sh
      - name: Check the caller contract against the PR base
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: bash scripts/check-contract.sh
